<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブラウザ完結 音量変更ツール</title>
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#18262b; --sub:#5d6f75; --line:#d5dedd;
  --accent:#0f7b6c; --accent-ink:#ffffff; --warn:#b4531a; --track:#cfdad8;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10191c; --panel:#192428; --ink:#e6f0ee; --sub:#93a8ad; --line:#2b3a3f; --accent:#3fc2ab; --accent-ink:#06211c; --warn:#f0a066; --track:#33454a;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  line-height:1.6; min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
main{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:.02em}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.drop{
  position:relative;display:block;text-align:center;padding:30px 16px;border:2px dashed var(--line);border-radius:14px;
  cursor:pointer;background:var(--panel);transition:border-color .15s, background .15s;
}
.drop.over,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.drop strong{display:block;font-size:1.05rem}
.drop span{color:var(--sub);font-size:.85rem}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop:focus-within{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.fname{font-weight:600;word-break:break-all}
.meta{color:var(--sub);font-size:.85rem}
.vol-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.vol-num{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.vol-num small{font-size:1.2rem;font-weight:600;margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ticks{display:flex;justify-content:space-between;color:var(--sub);font-size:.75rem}
.presets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,select{font:inherit;color:inherit}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player{display:flex;align-items:center;gap:12px}
.player .btn{flex:1}
#wave{width:100%;height:120px;display:block;touch-action:none;border-radius:10px;background:color-mix(in srgb,var(--track) 25%,var(--panel))}
.time{margin-top:6px;display:flex;justify-content:space-between;color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums}
.warn{color:var(--warn);font-size:.85rem;min-height:1.4em;margin:8px 0 0}
.opts{display:flex;gap:10px;margin-bottom:12px}
.opts label{flex:1;font-size:.8rem;color:var(--sub);display:block}
select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px;margin-top:2px}
progress{width:100%;height:8px;margin-top:12px;accent-color:var(--accent)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top select{width:auto;min-height:36px;margin:0;padding:0 8px}
.status{font-size:.85rem;color:var(--sub);margin:8px 0 0;min-height:1.4em}
.note{font-size:.78rem;color:var(--sub);text-align:center;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><h1 data-i18n="title"></h1><select id="lang" aria-label="Language"></select></div>
  <p class="lead" data-i18n="lead"></p>

  <label class="drop" id="drop" for="file">
    <input type="file" id="file" accept=".mp3,.wav,.m4a,.mp4,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,video/mp4">
    <strong id="dropTitle"></strong>
    <span data-i18n="dropSub"></span>
  </label>

  <div id="app" hidden>
    <section class="panel" style="margin-top:14px">
      <div class="fname" id="fname"></div>
      <div class="meta" id="fmeta"></div>
    </section>

    <section class="panel">
      <canvas id="wave" data-i18n-aria="waveAria"></canvas>
      <div class="time"><span id="tStart">0:00.0</span><span id="tMid">0:00.0 / 0:00.0</span><span id="tEnd">0:00.0</span></div>
      <p class="meta" style="margin:6px 0 12px" data-i18n="hint"></p>
      <div class="player">
        <button class="btn" id="play"></button>
        <button class="btn ghost" id="reset" data-i18n="reset"></button>
      </div>
    </section>

    <section class="panel">
      <div class="vol-row">
        <div class="vol-num"><span id="volNum">100</span><small>%</small></div>
        <div class="meta" id="dbNum">0.0 dB</div>
      </div>
      <input type="range" id="vol" min="0" max="200" step="1" value="100" data-i18n-aria="volAria">
      <div class="ticks"><span>0%</span><span>100%</span><span>200%</span></div>
      <div class="presets">
        <button class="chip" data-v="50">50%</button>
        <button class="chip" data-v="100">100%</button>
        <button class="chip" data-v="150">150%</button>
        <button class="chip" data-v="200">200%</button>
      </div>
      <p class="warn" id="warn"></p>
    </section>

    <section class="panel">
      <div class="opts">
        <label><span data-i18n="fmtLabel"></span>
          <select id="fmt"><option value="mp3">MP3</option><option value="wav" data-i18n="optWav"></option></select>
        </label>
        <label id="brWrap"><span data-i18n="brLabel"></span>
          <select id="br"><option>128</option><option selected>192</option><option>256</option><option>320</option></select>
        </label>
      </div>
      <button class="btn" id="dl" data-i18n="dl"></button>
      <progress id="prog" max="100" value="0" hidden></progress>
      <p class="status" id="status" role="status"></p>
    </section>
  </div>

  <p class="note" data-i18n="note"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, gainNode = null, buf = null, src = null;
  let playing = false, startedAt = 0, offset = 0, raf = 0, baseName = 'audio', peak = 0;
  let ts = 0, te = 0, peaks = null, drag = null;
  const MIN = 0.1;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fmtTime = s => { s = Math.max(0, s); const m = s/60|0, r = s%60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };
  const tick0 = () => new Promise(r => setTimeout(r, 0));

  // ---- 多言語対応（言語を足すときは I18N にオブジェクトを追加するだけ） ----
  const I18N = {
    ja: { _name:"日本語",
      title:"音量変更ツール",
      lead:"MP3・WAV・M4A・MP4（動画は音声のみ使用）を読み込んで、音量変更と、波形を見ながらの前後カットができます。保存形式はMP3またはWAVです。ファイルはこの端末のブラウザ内だけで処理され、外部へ送信されません。",
      choose:"音声ファイルを選択", loading:"読み込み中…", another:"別のファイルを選択", dropSub:"タップして選ぶ、またはここにドラッグ＆ドロップ",
      waveAria:"波形。両端の丸をドラッグして使う範囲を選択", hint:"波形の左右の丸をドラッグして、残す範囲を選びます。波形をタップすると再生位置が移動します。",
      reset:"全体に戻す", play:"再生", pause:"一時停止", volAria:"音量（パーセント）", fmtLabel:"保存形式", optWav:"WAV（無劣化）", brLabel:"MP3ビットレート（kbps）",
      dl:"音量を変更して保存", note:"サーバーへのアップロードは行いません。ご自身が利用権を持つ音声のみ加工してください。",
      mute:"無音", clip:"音量が大きすぎる部分があり、音が割れる（クリップする）可能性があります。", errRead:"このファイルを読み込めませんでした。MP3・WAV・M4A・MP4形式か確認してください。動画は音声付きで、サイズが大きすぎないものをお試しください。",
      mono:"モノラル", stereo:"ステレオ", converting:"変換中…（画面を閉じないでください）", fallbackWav:"MP3エンコーダを読み込めなかったため、WAVで保存します。",
      done:"変換が完了しました。ファイルはこの端末のダウンロード先に保存されます。", fail:"変換に失敗しました：{msg}" },
    en: { _name:"English",
      title:"Volume Changer",
      lead:"Load an MP3, WAV, M4A, or MP4 file (only the audio is used from video), change its volume, and trim the start and end while viewing the waveform. Save as MP3 or WAV. Your file is processed only in this browser and is never uploaded.",
      choose:"Choose an audio file", loading:"Loading…", another:"Choose another file", dropSub:"Tap to choose, or drag and drop here",
      waveAria:"Waveform. Drag the handles at both ends to choose the range", hint:"Drag the two handles on the waveform to choose the part to keep. Tap the waveform to move the playhead.",
      reset:"Reset range", play:"Play", pause:"Pause", volAria:"Volume (percent)", fmtLabel:"Save as", optWav:"WAV (lossless)", brLabel:"MP3 bitrate (kbps)",
      dl:"Apply volume and save", note:"Nothing is uploaded to a server. Only process audio you have the right to use.",
      mute:"Mute", clip:"Some parts may be too loud and could clip (distort).", errRead:"Could not read this file. Check that it is MP3, WAV, M4A, or MP4 with audio, and not too large.",
      mono:"Mono", stereo:"Stereo", converting:"Converting… keep this screen open.", fallbackWav:"The MP3 encoder could not be loaded, so the file will be saved as WAV.",
      done:"Done. The file is saved to your device's downloads.", fail:"Conversion failed: {msg}" },
    zh: { _name:"中文（简体）",
      title:"音量调节工具",
      lead:"导入 MP3、WAV、M4A 或 MP4 文件（视频仅使用音频），调整音量，并在查看波形的同时裁剪开头和结尾。可保存为 MP3 或 WAV。文件仅在本设备的浏览器中处理，不会上传到任何服务器。",
      choose:"选择音频文件", loading:"正在加载…", another:"选择其他文件", dropSub:"点按选择，或拖放到此处",
      waveAria:"波形。拖动两端的圆点选择范围", hint:"拖动波形两端的圆点来选择要保留的范围。点按波形可移动播放位置。",
      reset:"恢复全部范围", play:"播放", pause:"暂停", volAria:"音量（百分比）", fmtLabel:"保存格式", optWav:"WAV（无损）", brLabel:"MP3 比特率 (kbps)",
      dl:"应用音量并保存", note:"不会上传到服务器。请仅处理你有权使用的音频。",
      mute:"静音", clip:"部分内容音量过大，可能出现削波（失真）。", errRead:"无法读取此文件。请确认是带音频的 MP3、WAV、M4A 或 MP4 格式，且文件不要过大。",
      mono:"单声道", stereo:"立体声", converting:"正在转换…请保持此页面打开。", fallbackWav:"无法加载 MP3 编码器，将以 WAV 格式保存。",
      done:"转换完成。文件将保存到本设备的下载位置。", fail:"转换失败：{msg}" }
  };
  let lastUrl = null, fileId = 0, dlDone = false;
  let cur = 'en', dropKey = 'choose', statusKey = null, statusVars = null;
  const t = (k, v) => String((I18N[cur][k] || I18N.en[k] || k)).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null) ? v[n] : m);
  function setDrop(k){ dropKey = k; $('dropTitle').textContent = t(k); }
  function setStatus(k, v){ statusKey = k; statusVars = v || null; $('status').textContent = k ? t(k, v) : ''; }
  function renderMeta(){
    $('fmeta').textContent = `${fmtTime(buf.duration)} / ${buf.sampleRate} Hz / ${t(buf.numberOfChannels === 1 ? 'mono' : 'stereo')} / ${(fileSize/1048576).toFixed(1)} MB`;
  }
  let fileSize = 0;
  function applyLang(){
    document.documentElement.lang = cur === 'zh' ? 'zh-CN' : cur;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('play').textContent = t(playing ? 'pause' : 'play');
    setDrop(dropKey); setStatus(statusKey, statusVars);
    if (buf){ renderMeta(); updateVol(); }
  }
  function initLang(){
    const sel = $('lang');
    Object.keys(I18N).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = I18N[k]._name; sel.appendChild(o); });
    let saved = null; try{ saved = localStorage.getItem('vc-lang'); }catch(e){}
    const nl = (navigator.language || 'en').toLowerCase();
    cur = I18N[saved] ? saved : nl.indexOf('ja') === 0 ? 'ja' : nl.indexOf('zh') === 0 ? 'zh' : 'en';
    sel.value = cur; applyLang();
    sel.addEventListener('change', () => { cur = sel.value; applyLang(); try{ localStorage.setItem('vc-lang', cur); }catch(e){} });
  }

  function ensureCtx(){
    if (!ctx){ ctx = new AC(); gainNode = ctx.createGain(); gainNode.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
  }
  const decode = ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
  const gainVal = () => $('vol').value / 100;

  function analyze(){
    const bins = 800, n = buf.length, per = n / bins, out = new Float32Array(bins);
    peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++){
      const d = buf.getChannelData(c);
      for (let b = 0; b < bins; b++){
        const a = b * per | 0, e = Math.min(n, (b + 1) * per | 0), st = Math.max(1, (e - a) / 64 | 0);
        let m = out[b];
        for (let i = a; i < e; i += st){ const v = Math.abs(d[i]); if (v > m) m = v; }
        out[b] = m;
      }
    }
    for (const v of out) if (v > peak) peak = v;
    peaks = out.map(v => peak ? v / peak : 0);
  }

  function clearResult(){
    if (lastUrl){ URL.revokeObjectURL(lastUrl); lastUrl = null; }
    if (statusKey === 'done' || statusKey === 'fail' || statusKey === 'fallbackWav') setStatus(null);
  }
  async function loadFile(f){
    if (!f) return;
    stop(true); setStatus(null);
    fileId++;
    clearResult(); $('prog').hidden = true;
    try{
      ensureCtx();
      setDrop('loading');
      buf = await decode(await f.arrayBuffer());
    }catch(e){
      buf = null; $('app').hidden = true;
      setDrop('choose');
      alert(t('errRead'));
      return;
    }
    setDrop('another');
    baseName = f.name.replace(/\.[^.]+$/, '');
    analyze();
    ts = 0; te = buf.duration; offset = 0;
    $('fname').textContent = f.name;
    fileSize = f.size; renderMeta();
    $('vol').value = 100; updateVol();
    $('app').hidden = false;
    refresh();
  }

  function updateVol(){
    const v = gainVal();
    $('volNum').textContent = $('vol').value;
    $('dbNum').textContent = v === 0 ? t('mute') : (20*Math.log10(v)).toFixed(1) + ' dB';
    if (gainNode) gainNode.gain.value = v;
    $('warn').textContent = (buf && peak * v > 1) ? t('clip') : '';
  }

  // ---- 波形・トリム ----
  function pos(){ return playing ? Math.min(te, ctx.currentTime - startedAt) : offset; }
  function refresh(){
    if (!buf) return;
    $('tStart').textContent = fmtTime(ts);
    $('tEnd').textContent = fmtTime(te);
    $('tMid').textContent = `${fmtTime(pos() - ts)} / ${fmtTime(te - ts)}`;
    drawWave();
  }
  function drawWave(){
    const cv = $('wave'), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !peaks) return;
    if (cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
    const g = cv.getContext('2d'), css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue('--accent'), track = css.getPropertyValue('--track'), ink = css.getPropertyValue('--ink'), panel = css.getPropertyValue('--panel');
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const x = t => t / buf.duration * W, xs = x(ts), xe = x(te), n = peaks.length, bw = Math.max(1, W / n - 0.5);
    for (let i = 0; i < n; i++){
      const px = i / n * W, h = Math.max(2, peaks[i] * (H - 10));
      g.fillStyle = (px >= xs - 1 && px <= xe) ? accent : track;
      g.fillRect(px, (H - h) / 2, bw, h);
    }
    g.fillStyle = accent; g.fillRect(xs - 2, 0, 4, H); g.fillRect(xe - 2, 0, 4, H);
    [xs, xe].forEach(px => {
      g.beginPath(); g.arc(px, H / 2, 12, 0, Math.PI * 2);
      g.fillStyle = accent; g.fill(); g.lineWidth = 3; g.strokeStyle = panel; g.stroke();
    });
    g.fillStyle = ink; g.fillRect(x(pos()) - 1, 0, 2, H);
  }
  const posX = e => { const r = $('wave').getBoundingClientRect(); return { px: e.clientX - r.left, W: r.width }; };

  $('wave').addEventListener('pointerdown', e => {
    if (!buf) return;
    const { px, W } = posX(e), xs = ts / buf.duration * W, xe = te / buf.duration * W;
    const ds = Math.abs(px - xs), de = Math.abs(px - xe);
    if (Math.min(ds, de) > 28){ seekTo(px / W * buf.duration); return; }
    drag = ds < de ? 's' : de < ds ? 'e' : (px < xs ? 's' : 'e');
    pause();
    $('wave').setPointerCapture(e.pointerId); e.preventDefault();
  });
  $('wave').addEventListener('pointermove', e => {
    if (!drag) return;
    const { px, W } = posX(e), t = clamp(px / W, 0, 1) * buf.duration;
    if (drag === 's') ts = Math.min(t, te - MIN); else te = Math.max(t, ts + MIN);
    offset = clamp(offset, ts, te);
    clearResult();
    refresh();
  });
  const endDrag = () => { drag = null; };
  $('wave').addEventListener('pointerup', endDrag);
  $('wave').addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', drawWave);
  $('reset').addEventListener('click', () => { if (!buf) return; pause(); ts = 0; te = buf.duration; offset = 0; clearResult(); refresh(); });

  function seekTo(t){
    const was = playing;
    if (was){ halt(); playing = false; }
    offset = clamp(t, ts, te);
    if (was) play(); else refresh();
  }

  // ---- 再生 ----
  function tick(){
    refresh();
    if (playing && pos() >= te - 0.03){ stop(true); return; }
    raf = requestAnimationFrame(tick);
  }
  function play(){
    if (!buf) return;
    ensureCtx();
    gainNode.gain.value = gainVal();
    if (offset < ts || offset >= te - 0.05) offset = ts;
    src = ctx.createBufferSource(); src.buffer = buf; src.connect(gainNode);
    src.start(0, offset, te - offset);
    startedAt = ctx.currentTime - offset; playing = true;
    $('play').textContent = t('pause');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  }
  function halt(){
    if (src){ try{ src.onended = null; src.stop(); }catch(e){} src.disconnect(); src = null; }
  }
  function pause(){
    if (!playing) return;
    offset = pos(); halt(); playing = false;
    $('play').textContent = t('play'); cancelAnimationFrame(raf); refresh();
  }
  function stop(reset){
    halt(); playing = false; cancelAnimationFrame(raf);
    if (reset) offset = ts;
    $('play').textContent = t('play'); refresh();
  }

  // ---- 書き出し ----
  function renderGained(){
    const ch = Math.min(2, buf.numberOfChannels), g = gainVal(), out = [];
    const i0 = Math.floor(ts * buf.sampleRate), i1 = Math.min(buf.length, Math.ceil(te * buf.sampleRate));
    for (let c = 0; c < ch; c++){
      const s = buf.getChannelData(c), d = new Int16Array(i1 - i0);
      for (let i = i0; i < i1; i++){
        let v = s[i] * g; v = v > 1 ? 1 : v < -1 ? -1 : v;
        d[i - i0] = v < 0 ? v * 32768 : v * 32767;
      }
      out.push(d);
    }
    return out;
  }
  function encodeWav(chs, rate){
    const n = chs[0].length, ch = chs.length, bytes = n * ch * 2;
    const ab = new ArrayBuffer(44 + bytes), dv = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); dv.setUint32(4, 36 + bytes, true); w(8,'WAVE'); w(12,'fmt ');
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
    dv.setUint32(24,rate,true); dv.setUint32(28,rate*ch*2,true); dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
    w(36,'data'); dv.setUint32(40,bytes,true);
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++){ dv.setInt16(o, chs[c][i], true); o += 2; }
    return new Blob([ab], {type:'audio/wav'});
  }
  async function encodeMp3(chs, rate, kbps, onProg){
    const enc = new lamejs.Mp3Encoder(chs.length, rate, kbps);
    const parts = [], N = chs[0].length, STEP = 1152 * 40;
    for (let i = 0; i < N; i += STEP){
      const l = chs[0].subarray(i, i + STEP), r = chs.length > 1 ? chs[1].subarray(i, i + STEP) : undefined;
      const b = r ? enc.encodeBuffer(l, r) : enc.encodeBuffer(l);
      if (b.length) parts.push(new Int8Array(b));
      onProg(i / N); await tick0();
    }
    const f = enc.flush(); if (f.length) parts.push(new Int8Array(f));
    return new Blob(parts, {type:'audio/mpeg'});
  }

  async function save(){
    if (!buf) return;
    pause();
    const id = fileId;
    const fmt = $('fmt').value, btn = $('dl'), prog = $('prog'), st = $('status');
    btn.disabled = true; prog.hidden = false; prog.value = 0;
    setStatus('converting');
    try{
      await tick0();
      let ext = fmt;
      if (fmt === 'mp3' && typeof lamejs === 'undefined'){ ext = 'wav'; setStatus('fallbackWav'); }
      const chs = renderGained();
      const blob = ext === 'wav'
        ? encodeWav(chs, buf.sampleRate)
        : await encodeMp3(chs, buf.sampleRate, +$('br').value, p => { prog.value = p * 100; });
      if (id !== fileId) return;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      const name = `${baseName}_vol${$('vol').value}.${ext}`;
      const a = document.createElement('a');
      a.href = lastUrl; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      prog.value = 100;
      dlDone = true;
      setStatus('done');
    }catch(e){
      console.error(e);
      setStatus('fail', {msg: String((e && e.message) || e)});
    }finally{
      btn.disabled = false; setTimeout(() => { prog.hidden = true; }, 800);
    }
  }

  // ---- イベント ----
  const drop = $('drop');
  ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  $('vol').addEventListener('input', () => { updateVol(); clearResult(); });
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { $('vol').value = b.dataset.v; updateVol(); clearResult(); }));
  $('play').addEventListener('click', () => playing ? pause() : play());
  $('fmt').addEventListener('change', () => { $('brWrap').hidden = $('fmt').value === 'wav'; clearResult(); });
  $('br').addEventListener('change', clearResult);
  $('dl').addEventListener('click', save);
  // 同じファイルを再選択しても change が発火するよう、選択ダイアログを開く直前に値を空にする
  // iOS Safari はダウンロード後に既存の file input が反応しなくなることがあるため、
  // input を作り直して毎回まっさらな状態にする
  function bindInput(){
    const old = $('file');
    const fi = old.cloneNode(false);
    fi.value = '';
    old.replaceWith(fi);
    fi.addEventListener('click', () => { fi.value = ''; });
    fi.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });
  }
  bindInput();
  // iOS Safari ではダウンロード後にファイル選択ダイアログが開かなくなる不具合があるため、
  // ダウンロード済みの状態でラベルをタップしたらページを読み込み直して状態をリセットする
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  drop.addEventListener('click', e => {
    if (dlDone && isIOS){ e.preventDefault(); e.stopPropagation(); location.reload(); }
  }, true);
  window.addEventListener('pageshow', bindInput);
  initLang();
})();
</script>
